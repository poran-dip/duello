name: Lighthouse

on:
  repository_dispatch:
    types:
      - vercel.deployment.success

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse
    if: github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Run Lighthouse
        run: |
          pnpm dlx @lhci/cli@0.15.x collect \
            --url="https://duello-tourneys.vercel.app" \
            --numberOfRuns=3

          pnpm dlx @lhci/cli@0.15.x assert
